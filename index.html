<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes" />
    <title>Salmon Tracker</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }
        body {
            font-family: -apple-system, 'Segoe UI', Roboto, sans-serif;
            background: #f4f2ed;
            color: #1e293b;
            padding: 12px 10px 80px;
        }
        .app-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            margin-bottom: 12px;
        }
        .app-header h1 {
            font-size: 22px;
            font-weight: 700;
        }
        .app-header h1 span {
            background: #e67e22;
            color: #fff;
            font-size: 12px;
            padding: 2px 12px;
            border-radius: 40px;
        }
        .header-actions button {
            padding: 6px 14px;
            border-radius: 40px;
            border: 1px solid #d0d5dd;
            background: #fff;
            font-size: 13px;
            margin-left: 4px;
        }
        .btn-danger {
            color: #b91c1c;
            border-color: #fecaca;
        }
        .quality-grid {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin: 12px 0 20px;
        }
        .quality-grid .q-btn {
            background: #fff;
            border: 1px solid #e2e8f0;
            border-radius: 14px;
            padding: 16px 8px;
            text-align: center;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            aspect-ratio: 1/1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
            transition: 0.2s;
        }
        .quality-grid .q-btn:active {
            transform: scale(0.96);
        }
        .quality-grid .q-btn .q-count {
            font-size: 32px;
            font-weight: 700;
            color: #e67e22;
            line-height: 1.2;
        }
        .quality-grid .q-btn .q-sub {
            font-size: 11px;
            color: #64748b;
            margin-top: 4px;
        }
        .quality-grid .q-btn .q-badge {
            position: absolute;
            top: 6px;
            right: 8px;
            font-size: 11px;
            background: #fdf2e9;
            color: #d35400;
            padding: 0 8px;
            border-radius: 40px;
            font-weight: 600;
        }
        .quality-grid .q-btn.quality-B {
            border-left: 4px solid #3b82f6;
        }
        .quality-grid .q-btn.quality-Bplus {
            border-left: 4px solid #8b5cf6;
        }
        .quality-grid .q-btn.quality-Cplus {
            border-left: 4px solid #22c55e;
        }
        .quality-grid .q-btn.quality-BS {
            border-left: 4px solid #f59e0b;
        }
        .quality-grid .q-btn.quality-MB {
            border-left: 4px solid #ef4444;
        }
        .quality-grid .q-btn:nth-child(4) {
            grid-column: 1/2;
        }
        .quality-grid .q-btn:nth-child(5) {
            grid-column: 2/3;
        }
        .logs-section {
            background: #fff;
            border-radius: 14px;
            padding: 16px;
            border: 1px solid #e2e8f0;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
            margin-top: 8px;
        }
        .filter-bar {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: #f8fafc;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .filter-bar select,
        .filter-bar input {
            padding: 6px 10px;
            border-radius: 8px;
            border: 1px solid #d0d5dd;
            font-size: 13px;
            background: #fff;
            max-width: 140px;
        }
        .filter-bar input[type="date"] {
            max-width: 130px;
        }
        .btn-secondary {
            background: #f1f5f9;
            border: 1px solid #d0d5dd;
            padding: 4px 12px;
            border-radius: 40px;
            font-size: 12px;
        }
        .btn-primary {
            background: #e67e22;
            color: #fff;
            font-weight: 600;
            padding: 8px 20px;
            border-radius: 40px;
            border: none;
            font-size: 14px;
        }
        .batch-actions {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            margin: 8px 0 12px;
            padding: 8px 4px;
            background: #f8fafc;
            border-radius: 10px;
            align-items: center;
        }
        .batch-actions .info {
            font-size: 13px;
            color: #64748b;
            margin-right: 8px;
        }
        .batch-actions .btn-primary {
            font-size: 12px;
            padding: 4px 14px;
        }
        .batch-actions .btn-secondary {
            font-size: 12px;
            padding: 4px 14px;
        }
        .summary-mini {
            display: flex;
            flex-wrap: wrap;
            gap: 12px 18px;
            padding: 8px 4px;
            border-bottom: 1px solid #e2e8f0;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .summary-mini .item {
            font-weight: 500;
        }
        .summary-mini .item .num {
            color: #e67e22;
            font-weight: 700;
        }
        .summary-mini .item .half {
            color: #64748b;
            font-weight: 400;
        }
        .table-wrapper {
            overflow-x: auto;
            border-radius: 10px;
            border: 1px solid #e2e8f0;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            min-width: 580px;
        }
        th {
            background: #f8fafc;
            padding: 10px 12px;
            text-align: left;
            font-size: 11px;
            text-transform: uppercase;
            color: #64748b;
            border-bottom: 2px solid #e2e8f0;
        }
        td {
            padding: 10px 12px;
            border-bottom: 1px solid #f1f5f9;
        }
        .badge-quality {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 40px;
            font-weight: 600;
            font-size: 11px;
        }
        .badge-quality.B {
            background: #dbeafe;
            color: #1d4ed8;
        }
        .badge-quality.Bplus {
            background: #ede9fe;
            color: #7c3aed;
        }
        .badge-quality.Cplus {
            background: #dcfce7;
            color: #16a34a;
        }
        .badge-quality.BS {
            background: #fef3c7;
            color: #b45309;
        }
        .badge-quality.MB {
            background: #fee2e2;
            color: #b91c1c;
        }
        .badge-box {
            font-size: 11px;
            padding: 1px 10px;
            border-radius: 40px;
            background: #f1f5f9;
        }
        .badge-box.half {
            background: #fef9c3;
            color: #854d0e;
        }
        .badge-box.full {
            background: #dbeafe;
            color: #1d4ed8;
        }
        .badge-delivered {
            font-size: 11px;
            padding: 1px 10px;
            border-radius: 40px;
            background: #dcfce7;
            color: #16a34a;
        }
        .badge-not-delivered {
            font-size: 11px;
            padding: 1px 10px;
            border-radius: 40px;
            background: #fee2e2;
            color: #b91c1c;
        }
        .row-actions button {
            padding: 4px 6px;
            border-radius: 6px;
            font-size: 15px;
            background: transparent;
            border: none;
        }
        .row-actions .delete-btn {
            color: #b91c1c;
        }
        .empty-state {
            text-align: center;
            padding: 30px 16px;
            color: #94a3b8;
        }
        .table-footer {
            display: flex;
            justify-content: space-between;
            flex-wrap: wrap;
            font-size: 12px;
            color: #64748b;
            margin-top: 12px;
        }
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            align-items: flex-end;
            justify-content: center;
            z-index: 200;
        }
        .modal-overlay.active {
            display: flex;
        }
        .modal-sheet {
            background: #fff;
            border-radius: 14px 14px 0 0;
            padding: 24px 20px 30px;
            max-width: 500px;
            width: 100%;
            max-height: 90vh;
            overflow-y: auto;
            transform: translateY(100%);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-sheet {
            transform: translateY(0);
        }
        .modal-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
        }
        .modal-header h2 {
            font-size: 18px;
            font-weight: 700;
        }
        .modal-header .close-btn {
            font-size: 28px;
            color: #94a3b8;
            padding: 0 6px;
        }
        .form-group {
            margin-bottom: 14px;
        }
        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 600;
            color: #64748b;
            margin-bottom: 4px;
        }
        .form-group input,
        .form-group select {
            width: 100%;
            padding: 10px 12px;
            border-radius: 10px;
            border: 1px solid #d0d5dd;
            background: #fafafa;
            font-size: 15px;
        }
        .form-group input[type="number"] {
            -moz-appearance: textfield;
        }
        .form-group input[type="number"]::-webkit-outer-spin-button,
        .form-group input[type="number"]::-webkit-inner-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        .inline-group {
            display: flex;
            gap: 12px;
        }
        .inline-group .form-group {
            flex: 1;
        }
        .toggle-group {
            display: flex;
            background: #f1f5f9;
            border-radius: 10px;
            padding: 3px;
            border: 1px solid #d0d5dd;
        }
        .toggle-group button {
            flex: 1;
            padding: 8px 0;
            border-radius: 7px;
            font-weight: 500;
            font-size: 14px;
            color: #64748b;
            background: transparent;
            border: none;
        }
        .toggle-group button.active {
            background: #fff;
            color: #1e293b;
            box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
        }
        .worker-chips {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            padding: 4px 0;
        }
        .worker-chip {
            padding: 6px 14px;
            border-radius: 40px;
            border: 1px solid #d0d5dd;
            background: #f8fafc;
            font-size: 13px;
            font-weight: 500;
            transition: 0.2s;
            cursor: pointer;
        }
        .worker-chip:active {
            transform: scale(0.96);
        }
        .worker-chip.selected {
            background: #e67e22;
            color: #fff;
            border-color: #e67e22;
        }
        .worker-chip .chip-num {
            font-weight: 400;
            color: #64748b;
            margin-right: 4px;
        }
        .worker-chip.selected .chip-num {
            color: #fdf2e9;
        }
        .worker-chip.none-chip {
            background: #f1f5f9;
            border-color: #d0d5dd;
        }
        .worker-chip.none-chip.selected {
            background: #94a3b8;
            border-color: #94a3b8;
            color: #fff;
        }
        .form-actions {
            display: flex;
            gap: 12px;
            margin-top: 18px;
        }
        .form-actions .btn-primary {
            flex: 1;
            justify-content: center;
            padding: 12px;
            font-size: 16px;
            border: none;
        }
        .form-actions .btn-secondary {
            padding: 12px 20px;
        }
        .toast {
            position: fixed;
            bottom: 80px;
            left: 50%;
            transform: translateX(-50%) translateY(80px);
            background: #0f172a;
            color: #fff;
            padding: 12px 24px;
            border-radius: 12px;
            font-weight: 500;
            font-size: 14px;
            opacity: 0;
            transition: 0.3s ease;
            pointer-events: none;
            z-index: 999;
            max-width: 90%;
        }
        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
        .toast.success {
            background: #16a34a;
        }
        .toast.error {
            background: #b91c1c;
        }
        .toast.info {
            background: #2563eb;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            background: #fff;
            border-top: 1px solid #e2e8f0;
            display: flex;
            justify-content: space-around;
            padding: 8px 0 env(safe-area-inset-bottom);
            z-index: 100;
        }
        .bottom-nav button {
            background: none;
            border: none;
            font-size: 13px;
            font-weight: 500;
            color: #94a3b8;
            padding: 6px 16px;
            border-radius: 10px;
            transition: 0.2s;
        }
        .bottom-nav button.active {
            color: #e67e22;
            background: #fdf2e9;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .workers-section {
            background: #fff;
            border-radius: 14px;
            padding: 16px;
            border: 1px solid #e2e8f0;
            margin-top: 8px;
        }
        .workers-section h2 {
            font-size: 18px;
            margin-bottom: 12px;
        }
        .worker-form-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            background: #f8fafc;
            padding: 12px;
            border-radius: 10px;
            margin-bottom: 12px;
        }
        .worker-form-row input {
            flex: 1;
            min-width: 100px;
            padding: 8px 10px;
            border-radius: 8px;
            border: 1px solid #d0d5dd;
            font-size: 14px;
        }
        .worker-form-row .btn-primary {
            padding: 8px 16px;
        }
        .worker-list {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 8px;
            max-height: 400px;
            overflow-y: auto;
        }
        .worker-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 8px 12px;
            background: #f8fafc;
            border-radius: 8px;
            border: 1px solid #e2e8f0;
        }
        .worker-item .info {
            font-weight: 500;
        }
        .worker-item .info .num {
            color: #e67e22;
            margin-right: 6px;
        }
        .worker-item .actions button {
            padding: 2px 6px;
            border-radius: 4px;
            border: none;
            background: transparent;
            font-size: 14px;
        }
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin: 12px 0;
        }
        .dash-card {
            background: #fff;
            border-radius: 14px;
            padding: 16px;
            border: 1px solid #e2e8f0;
            text-align: center;
        }
        .dash-card .label {
            font-size: 12px;
            color: #64748b;
            text-transform: uppercase;
            font-weight: 600;
        }
        .dash-card .value {
            font-size: 28px;
            font-weight: 700;
            color: #e67e22;
            margin: 4px 0;
        }
        .dash-card .sub {
            font-size: 12px;
            color: #94a3b8;
        }
        .dash-card .delivered {
            color: #16a34a;
        }
        .dash-card .remaining {
            color: #b91c1c;
        }
        .dash-quality {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .dash-quality .q-item {
            background: #f8fafc;
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 13px;
            font-weight: 500;
        }
        .dash-quality .q-item .q-num {
            font-weight: 700;
            color: #e67e22;
        }
        .dash-bcombined {
            background: #fef3c7;
            border-color: #f59e0b;
        }
        .dash-bcombined .value {
            color: #b45309;
        }
        /* checkbox column */
        .select-col {
            width: 32px;
            text-align: center;
        }
        .select-col input[type="checkbox"] {
            width: 18px;
            height: 18px;
            accent-color: #e67e22;
        }
        @media (max-width: 600px) {
            .quality-grid {
                gap: 8px;
            }
            .quality-grid .q-btn {
                padding: 12px 4px;
            }
            .quality-grid .q-btn .q-count {
                font-size: 28px;
            }
            .filter-bar {
                flex-direction: column;
                align-items: stretch;
            }
            .filter-bar select,
            .filter-bar input {
                max-width: 100%;
            }
            .modal-sheet {
                padding: 20px 16px 24px;
            }
            .form-actions {
                flex-direction: column;
            }
            .form-actions .btn-primary {
                width: 100%;
            }
            .worker-chips {
                gap: 6px;
            }
            .worker-chip {
                font-size: 12px;
                padding: 4px 10px;
            }
            .inline-group {
                flex-direction: column;
                gap: 0;
            }
            .dashboard-grid {
                grid-template-columns: 1fr 1fr;
            }
            .batch-actions {
                flex-direction: column;
                align-items: stretch;
            }
            .batch-actions .info {
                text-align: center;
            }
        }
        @media (min-width: 601px) {
            .quality-grid {
                grid-template-columns: repeat(5, 1fr);
            }
            .quality-grid .q-btn:nth-child(4) {
                grid-column: auto;
            }
            .quality-grid .q-btn:nth-child(5) {
                grid-column: auto;
            }
            .dashboard-grid {
                grid-template-columns: repeat(3, 1fr);
            }
        }
    </style>
</head>
<body>
    <div class="app">
        <header class="app-header">
            <h1>🐟 Salmon <span>v4</span></h1>
            <div class="header-actions">
                <button onclick="exportCSV()">📤 CSV</button>
                <button onclick="clearAllData()" class="btn-danger">🗑️ Clear</button>
            </div>
        </header>

        <!-- Production Tab -->
        <div id="tabProduction" class="tab-content active">
            <div class="quality-grid" id="qualityGrid"></div>
            <div class="logs-section">
                <div class="filter-bar">
                    <select id="filterDateRange">
                        <option value="today">Today</option>
                        <option value="week">This Week</option>
                        <option value="custom">Custom</option>
                    </select>
                    <input type="date" id="filterDateFrom" style="display:none;" />
                    <input type="date" id="filterDateTo" style="display:none;" />
                    <button class="btn-secondary" onclick="applyFilters()">Apply</button>
                    <select id="filterQuality">
                        <option value="all">All Qualities</option>
                        <option value="B">B</option>
                        <option value="B+">B+</option>
                        <option value="C+">C+</option>
                        <option value="BS">BS</option>
                        <option value="MB">MB</option>
                    </select>
                    <select id="filterWorker"><option value="all">All Workers</option></select>
                    <select id="filterDelivered">
                        <option value="all">All</option>
                        <option value="delivered">Delivered</option>
                        <option value="remaining">Remaining</option>
                    </select>
                    <button class="btn-secondary" onclick="resetFilters()">Reset</button>
                </div>

                <!-- Batch actions -->
                <div class="batch-actions" id="batchActions">
                    <span class="info" id="selectionInfo">0 selected</span>
                    <button class="btn-primary" onclick="batchDeliver(true)">✅ Mark Selected as Delivered</button>
                    <button class="btn-secondary" onclick="batchDeliver(false)">⏳ Mark Selected as Remaining</button>
                    <button class="btn-secondary" onclick="clearSelection()">Clear Selection</button>
                </div>

                <div class="summary-mini" id="summaryMini"></div>
                <div class="table-wrapper">
                    <table>
                        <thead><tr>
                            <th class="select-col"><input type="checkbox" id="selectAll" onchange="toggleSelectAll()" /></th>
                            <th>Date</th><th>Quality</th><th>Full</th><th>Half</th><th>Worker</th><th>Delivered</th><th style="text-align:center;">Actions</th>
                        </tr></thead>
                        <tbody id="entriesBody"></tbody>
                    </table>
                </div>
                <div class="table-footer">
                    <span id="entryCount">0 entries</span>
                    <span id="totalFullBoxes">Total: 0 full, 0 half</span>
                </div>
            </div>
        </div>

        <!-- Dashboard Tab -->
        <div id="tabDashboard" class="tab-content">
            <div style="margin-top:12px;">
                <div class="dashboard-grid" id="dashboardGrid"></div>
                <div style="background:#fff;border-radius:14px;padding:16px;border:1px solid #e2e8f0;margin-top:12px;">
                    <h3 style="font-size:16px;margin-bottom:8px;">📊 Today's Breakdown</h3>
                    <div id="dashboardBreakdown"></div>
                </div>
            </div>
        </div>

        <!-- Workers Tab -->
        <div id="tabWorkers" class="tab-content">
            <div class="workers-section">
                <h2>👥 Manage Workers</h2>
                <div class="worker-form-row" id="workerFormRow">
                    <input type="number" id="workerNumber" placeholder="Number (ID)" min="1" />
                    <input type="text" id="workerName" placeholder="Name" />
                    <button class="btn-primary" id="workerSubmitBtn" onclick="handleWorkerSubmit()">➕ Add</button>
                    <button class="btn-secondary" onclick="cancelWorkerEdit()" id="workerCancelBtn" style="display:none;">Cancel</button>
                </div>
                <div class="worker-list" id="workerList"></div>
                <div style="margin-top:8px;font-size:12px;color:#94a3b8;"><span id="workerCount">0 workers</span></div>
            </div>
        </div>

        <!-- Bottom Navigation -->
        <nav class="bottom-nav">
            <button class="active" data-tab="tabProduction">📊 Production</button>
            <button data-tab="tabDashboard">📈 Dashboard</button>
            <button data-tab="tabWorkers">👥 Workers</button>
        </nav>
    </div>

    <!-- Modal -->
    <div class="modal-overlay" id="entryModal">
        <div class="modal-sheet">
            <div class="modal-header">
                <h2 id="modalTitle">Add Entry</h2>
                <button class="close-btn" onclick="closeModal()">✕</button>
            </div>
            <form id="modalForm" onsubmit="handleModalSubmit(event)">
                <div class="form-group">
                    <label>Quality</label>
                    <input type="text" id="modalQuality" readonly style="background:#f1f5f9;font-weight:600;" />
                </div>
                <div class="inline-group">
                    <div class="form-group">
                        <label for="modalFullCount">📦 Full Boxes</label>
                        <input type="number" id="modalFullCount" min="0" step="1" value="0" inputmode="numeric" />
                    </div>
                    <div class="form-group">
                        <label for="modalHalfCount">🧊 Half Boxes</label>
                        <input type="number" id="modalHalfCount" min="0" step="1" value="0" inputmode="numeric" />
                    </div>
                </div>
                <div class="form-group">
                    <label>👤 Worker (tap to select)</label>
                    <div class="worker-chips" id="workerChips"></div>
                    <input type="hidden" id="modalWorker" value="" />
                </div>
                <div class="form-group" style="flex-direction:row;align-items:center;gap:10px;">
                    <label style="margin:0;">📦 Delivered</label>
                    <input type="checkbox" id="modalDelivered" style="width:24px;height:24px;margin:0;" />
                </div>
                <div class="form-actions">
                    <button type="submit" class="btn-primary">➕ Add Entry</button>
                    <button type="button" class="btn-secondary" onclick="closeModal()">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div id="toast" class="toast"></div>

    <script>
        // ─── DATA LAYER ──────────────────────────────
        let storage = (function() {
            try {
                if (window.localStorage) {
                    return {
                        get: (key) => JSON.parse(localStorage.getItem(key)),
                        set: (key, val) => localStorage.setItem(key, JSON.stringify(val)),
                        remove: (key) => localStorage.removeItem(key)
                    };
                }
            } catch (e) {}
            try {
                if (window.sessionStorage) {
                    return {
                        get: (key) => JSON.parse(sessionStorage.getItem(key)),
                        set: (key, val) => sessionStorage.setItem(key, JSON.stringify(val)),
                        remove: (key) => sessionStorage.removeItem(key)
                    };
                }
            } catch (e) {}
            const mem = {};
            return {
                get: (key) => mem[key] || null,
                set: (key, val) => { mem[key] = val; },
                remove: (key) => { delete mem[key]; }
            };
        })();

        const STORAGE_ENTRIES = 'salmon_entries_v4';
        const STORAGE_WORKERS = 'salmon_workers';

        function loadEntries() {
            let data = storage.get(STORAGE_ENTRIES) || [];
            data = data.map(e => {
                if (e.boxCount !== undefined && e.boxType !== undefined) {
                    if (e.boxType === 'full') {
                        e.fullCount = e.boxCount;
                        e.halfCount = 0;
                    } else {
                        e.fullCount = 0;
                        e.halfCount = e.boxCount;
                    }
                    delete e.boxCount;
                    delete e.boxType;
                }
                if (e.delivered === undefined) e.delivered = false;
                if (e.fullCount === undefined) e.fullCount = 0;
                if (e.halfCount === undefined) e.halfCount = 0;
                return e;
            });
            return data;
        }

        function saveEntries(data) { storage.set(STORAGE_ENTRIES, data); }

        function loadWorkers() {
            let w = storage.get(STORAGE_WORKERS);
            if (w && w.length) return w;
            const defaults = [
                { number: 1, name: 'Qi Che' },
                { number: 2, name: 'Suman' },
                { number: 3, name: 'Arjun' },
                { number: 6, name: 'Aorigele' },
                { number: 7, name: 'Jie Tang' },
                { number: 9, name: 'Yongfu Tang' }
            ];
            saveWorkers(defaults);
            return defaults;
        }

        function saveWorkers(data) { storage.set(STORAGE_WORKERS, data); }

        let entries = loadEntries();
        let workers = loadWorkers();
        let editingEntryId = null;
        let selectedWorkerNum = null;
        let editingWorkerNumber = null;

        // ─── SELECTION STATE ──────────────────────────
        let selectedIds = new Set();

        // ─── HELPERS ──────────────────────────────────
        function todayStr() { return new Date().toISOString().slice(0, 10); }

        function getWorkerByNumber(num) { return workers.find(w => w.number === num); }

        function getTodayEntries() {
            const t = todayStr();
            return entries.filter(e => e.date === t);
        }

        function getCounts(entriesList) {
            const qualities = ['B', 'B+', 'C+', 'BS', 'MB'];
            const result = {};
            qualities.forEach(q => {
                result[q] = { full: 0, half: 0, deliveredFull: 0, deliveredHalf: 0 };
            });
            entriesList.forEach(e => {
                if (result[e.quality]) {
                    result[e.quality].full += e.fullCount || 0;
                    result[e.quality].half += e.halfCount || 0;
                    if (e.delivered) {
                        result[e.quality].deliveredFull += e.fullCount || 0;
                        result[e.quality].deliveredHalf += e.halfCount || 0;
                    }
                }
            });
            return result;
        }

        // ─── TOAST ────────────────────────────────────
        let toastTimeout;

        function showToast(msg, type = 'info') {
            const el = document.getElementById('toast');
            if (!el) { alert(msg); return; }
            el.textContent = msg;
            el.className = 'toast ' + type;
            void el.offsetWidth;
            el.classList.add('show');
            clearTimeout(toastTimeout);
            toastTimeout = setTimeout(() => el.classList.remove('show'), 2500);
        }

        // ─── WORKER CHIPS ─────────────────────────────
        function renderWorkerChips() {
            const container = document.getElementById('workerChips');
            const sorted = [...workers].sort((a, b) => a.number - b.number);
            let html =
                `<div class="worker-chip none-chip ${!selectedWorkerNum ? 'selected' : ''}" onclick="selectWorker(null)">None</div>`;
            sorted.forEach(w => {
                const sel = (selectedWorkerNum === w.number) ? 'selected' : '';
                html += `<div class="worker-chip ${sel}" onclick="selectWorker(${w.number})">
                            <span class="chip-num">#${w.number}</span> ${w.name}
                        </div>`;
            });
            container.innerHTML = html;
        }

        function selectWorker(num) {
            selectedWorkerNum = (selectedWorkerNum === num) ? null : num;
            document.getElementById('modalWorker').value = selectedWorkerNum || '';
            renderWorkerChips();
        }

        // ─── MODAL ────────────────────────────────────
        function openModal(quality) {
            selectedWorkerNum = null;
            document.getElementById('modalQuality').value = quality;
            document.getElementById('modalTitle').textContent = `Add ${quality} Entry`;
            document.getElementById('modalFullCount').value = 0;
            document.getElementById('modalHalfCount').value = 0;
            document.getElementById('modalDelivered').checked = false;
            document.getElementById('modalWorker').value = '';
            renderWorkerChips();
            document.getElementById('entryModal').classList.add('active');
            document.getElementById('modalFullCount').focus();
        }

        function closeModal() {
            document.getElementById('entryModal').classList.remove('active');
            editingEntryId = null;
        }

        function handleModalSubmit(e) {
            e.preventDefault();
            const quality = document.getElementById('modalQuality').value.trim();
            const fullCount = parseInt(document.getElementById('modalFullCount').value) || 0;
            const halfCount = parseInt(document.getElementById('modalHalfCount').value) || 0;
            const workerNum = parseInt(document.getElementById('modalWorker').value) || null;
            const delivered = document.getElementById('modalDelivered').checked;
            const date = todayStr();

            if (!quality) { showToast('Quality required.', 'error'); return; }
            if (fullCount === 0 && halfCount === 0) { showToast('Add at least one box.', 'error'); return; }

            const entry = {
                id: editingEntryId || Date.now().toString(36) + '_' + Math.random().toString(36).slice(2, 7),
                date,
                quality,
                fullCount,
                halfCount,
                workerNum,
                delivered,
                updatedAt: new Date().toISOString()
            };

            if (editingEntryId) {
                const idx = entries.findIndex(e => e.id === editingEntryId);
                if (idx !== -1) entries[idx] = entry;
                else entries.push(entry);
                editingEntryId = null;
                showToast('Entry updated!', 'success');
            } else {
                entries.push(entry);
                showToast('Entry added!', 'success');
            }

            saveEntries(entries);
            closeModal();
            renderAll();
        }

        // ─── SELECTION HELPERS ────────────────────────
        function toggleSelectAll() {
            const checked = document.getElementById('selectAll').checked;
            const filtered = getFilteredEntries();
            if (checked) {
                filtered.forEach(e => selectedIds.add(e.id));
            } else {
                filtered.forEach(e => selectedIds.delete(e.id));
            }
            renderTable(filtered);
            updateSelectionInfo();
        }

        function toggleSelect(id) {
            if (selectedIds.has(id)) selectedIds.delete(id);
            else selectedIds.add(id);
            const filtered = getFilteredEntries();
            renderTable(filtered);
            updateSelectionInfo();
            // Update select all checkbox
            const allChecked = filtered.every(e => selectedIds.has(e.id));
            document.getElementById('selectAll').checked = allChecked && filtered.length > 0;
        }

        function clearSelection() {
            selectedIds.clear();
            document.getElementById('selectAll').checked = false;
            const filtered = getFilteredEntries();
            renderTable(filtered);
            updateSelectionInfo();
        }

        function updateSelectionInfo() {
            document.getElementById('selectionInfo').textContent = `${selectedIds.size} selected`;
        }

        function batchDeliver(deliver) {
            if (selectedIds.size === 0) {
                showToast('No entries selected.', 'error');
                return;
            }
            const msg = deliver ? `Mark ${selectedIds.size} entries as delivered?` :
                `Mark ${selectedIds.size} entries as remaining?`;
            if (!confirm(msg)) return;

            entries.forEach(e => {
                if (selectedIds.has(e.id)) {
                    e.delivered = deliver;
                }
            });
            saveEntries(entries);
            clearSelection();
            renderAll();
            showToast(`${selectedIds.size} entries updated.`, 'success');
        }

        // ─── RENDER ──────────────────────────────────
        function renderQualityButtons() {
            const todayEntries = getTodayEntries();
            const counts = getCounts(todayEntries);
            const qualities = ['B', 'B+', 'C+', 'BS', 'MB'];
            let html = '';
            qualities.forEach(q => {
                const total = counts[q].full + counts[q].half;
                const cls = 'quality-' + q.replace('+', 'plus');
                html += `
                    <div class="q-btn ${cls}" onclick="openModal('${q}')">
                        <span class="q-badge">${q}</span>
                        <span class="q-count">${total}</span>
                        <span class="q-sub">boxes today</span>
                    </div>
                `;
            });
            document.getElementById('qualityGrid').innerHTML = html;
        }

        function getFilteredEntries() {
            let filtered = [...entries];
            const range = document.getElementById('filterDateRange').value;
            if (range === 'today') {
                const t = todayStr();
                filtered = filtered.filter(e => e.date === t);
            } else if (range === 'week') {
                const now = new Date();
                const day = now.getDay() || 7;
                const diff = day - 1;
                const monday = new Date(now);
                monday.setDate(now.getDate() - diff);
                const from = monday.toISOString().slice(0, 10);
                const to = todayStr();
                filtered = filtered.filter(e => e.date >= from && e.date <= to);
            } else if (range === 'custom') {
                const from = document.getElementById('filterDateFrom').value;
                const to = document.getElementById('filterDateTo').value;
                if (from) filtered = filtered.filter(e => e.date >= from);
                if (to) filtered = filtered.filter(e => e.date <= to);
            }
            const qf = document.getElementById('filterQuality').value;
            if (qf !== 'all') filtered = filtered.filter(e => e.quality === qf);
            const wv = document.getElementById('filterWorker').value;
            if (wv !== 'all' && wv) {
                const num = parseInt(wv);
                filtered = filtered.filter(e => e.workerNum === num);
            }
            const del = document.getElementById('filterDelivered').value;
            if (del === 'delivered') filtered = filtered.filter(e => e.delivered === true);
            else if (del === 'remaining') filtered = filtered.filter(e => e.delivered === false);
            return filtered;
        }

        function renderSummaryMini(filtered) {
            const counts = getCounts(filtered);
            const qualities = ['B', 'B+', 'C+', 'BS', 'MB'];
            let totalFull = 0,
                totalHalf = 0;
            let totalDeliveredFull = 0,
                totalDeliveredHalf = 0;
            qualities.forEach(q => {
                totalFull += counts[q].full;
                totalHalf += counts[q].half;
                totalDeliveredFull += counts[q].deliveredFull;
                totalDeliveredHalf += counts[q].deliveredHalf;
            });
            const remainingFull = totalFull - totalDeliveredFull;
            const remainingHalf = totalHalf - totalDeliveredHalf;

            let html = `<span class="item">📦 Total: <span class="num">${totalFull}</span> full + <span class="num">${totalHalf}</span> half</span>`;
            html +=
                `<span class="item">✅ Delivered: <span class="num">${totalDeliveredFull}</span> full + <span class="num">${totalDeliveredHalf}</span> half</span>`;
            html +=
                `<span class="item">📦 Remaining: <span class="num">${remainingFull}</span> full + <span class="num">${remainingHalf}</span> half</span>`;

            qualities.forEach(q => {
                const f = counts[q].full;
                const h = counts[q].half;
                const df = counts[q].deliveredFull;
                const dh = counts[q].deliveredHalf;
                if (f > 0 || h > 0) {
                    html +=
                        `<span class="item">${q}: <span class="num">${f}</span> full + <span class="half">${h}</span> half (delivered: ${df} full + ${dh} half)</span>`;
                }
            });
            document.getElementById('summaryMini').innerHTML = html;
        }

        function renderTable(filtered) {
            const tbody = document.getElementById('entriesBody');
            if (filtered.length === 0) {
                tbody.innerHTML = `<tr><td colspan="8"><div class="empty-state">📭 No entries.</div></td></tr>`;
                document.getElementById('entryCount').textContent = '0 entries';
                document.getElementById('totalFullBoxes').textContent = 'Total: 0 full, 0 half';
                return;
            }
            const sorted = [...filtered].sort((a, b) => b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
            let rows = '';
            sorted.forEach(e => {
                const qCls = e.quality.replace('+', 'plus');
                const workerDisplay = e.workerNum ? `#${e.workerNum} ${getWorkerByNumber(e.workerNum)?.name || ''}` : '—';
                const deliveredLabel = e.delivered ? '✅ Delivered' : '⏳ Remaining';
                const deliveredCls = e.delivered ? 'badge-delivered' : 'badge-not-delivered';
                const checked = selectedIds.has(e.id) ? 'checked' : '';
                rows += `
                    <tr>
                        <td class="select-col"><input type="checkbox" ${checked} onchange="toggleSelect('${e.id}')" /></td>
                        <td><strong>${e.date}</strong></td>
                        <td><span class="badge-quality ${qCls}">${e.quality}</span></td>
                        <td>${e.fullCount || 0}</td>
                        <td>${e.halfCount || 0}</td>
                        <td>${workerDisplay}</td>
                        <td><span class="${deliveredCls}">${deliveredLabel}</span></td>
                        <td style="text-align:center;">
                            <button onclick="toggleDelivered('${e.id}')" title="Toggle delivered">📦</button>
                            <button onclick="editEntry('${e.id}')">✏️</button>
                            <button onclick="deleteEntry('${e.id}')" class="delete-btn">🗑️</button>
                        </td>
                    </tr>
                `;
            });
            tbody.innerHTML = rows;
            let totalFull = 0,
                totalHalf = 0;
            filtered.forEach(e => {
                totalFull += e.fullCount || 0;
                totalHalf += e.halfCount || 0;
            });
            document.getElementById('entryCount').textContent = `${filtered.length} entries`;
            document.getElementById('totalFullBoxes').textContent = `Total: ${totalFull} full, ${totalHalf} half`;

            // Update select all
            const allChecked = filtered.every(e => selectedIds.has(e.id));
            document.getElementById('selectAll').checked = allChecked && filtered.length > 0;
            updateSelectionInfo();
        }

        function renderWorkers() {
            const sorted = [...workers].sort((a, b) => a.number - b.number);
            const list = document.getElementById('workerList');
            if (sorted.length === 0) {
                list.innerHTML = '<div class="empty-state">No workers added yet.</div>';
                document.getElementById('workerCount').textContent = '0 workers';
                return;
            }
            let html = '';
            sorted.forEach(w => {
                html += `
                    <div class="worker-item">
                        <div class="info"><span class="num">#${w.number}</span> ${w.name}</div>
                        <div class="actions">
                            <button onclick="editWorker(${w.number})">✏️</button>
                            <button onclick="deleteWorker(${w.number})" style="color:#b91c1c;">🗑️</button>
                        </div>
                    </div>
                `;
            });
            list.innerHTML = html;
            document.getElementById('workerCount').textContent = `${sorted.length} workers`;
            renderWorkerChips();
        }

        function renderDashboard() {
            const todayEntries = getTodayEntries();
            const counts = getCounts(todayEntries);
            const qualities = ['B', 'B+', 'C+', 'BS', 'MB'];
            let totalFull = 0,
                totalHalf = 0;
            let totalDeliveredFull = 0,
                totalDeliveredHalf = 0;
            qualities.forEach(q => {
                totalFull += counts[q].full;
                totalHalf += counts[q].half;
                totalDeliveredFull += counts[q].deliveredFull;
                totalDeliveredHalf += counts[q].deliveredHalf;
            });
            const remainingFull = totalFull - totalDeliveredFull;
            const remainingHalf = totalHalf - totalDeliveredHalf;
            const totalBoxes = totalFull + totalHalf;
            const deliveredBoxes = totalDeliveredFull + totalDeliveredHalf;
            const remainingBoxes = remainingFull + remainingHalf;

            const bFull = counts['B'].full + counts['MB'].full;
            const bHalf = counts['B'].half + counts['MB'].half;
            const bDeliveredFull = counts['B'].deliveredFull + counts['MB'].deliveredFull;
            const bDeliveredHalf = counts['B'].deliveredHalf + counts['MB'].deliveredHalf;
            const bRemainingFull = bFull - bDeliveredFull;
            const bRemainingHalf = bHalf - bDeliveredHalf;

            let gridHtml = `
                <div class="dash-card">
                    <div class="label">Total Production</div>
                    <div class="value">${totalBoxes}</div>
                    <div class="sub">${totalFull} full + ${totalHalf} half</div>
                </div>
                <div class="dash-card">
                    <div class="label">Delivered</div>
                    <div class="value delivered">${deliveredBoxes}</div>
                    <div class="sub">${totalDeliveredFull} full + ${totalDeliveredHalf} half</div>
                </div>
                <div class="dash-card">
                    <div class="label">Remaining</div>
                    <div class="value remaining">${remainingBoxes}</div>
                    <div class="sub">${remainingFull} full + ${remainingHalf} half</div>
                </div>
                <div class="dash-card dash-bcombined" style="grid-column:1/-1;">
                    <div class="label">Combined B (B + MB)</div>
                    <div class="value">${bFull + bHalf}</div>
                    <div class="sub">${bFull} full + ${bHalf} half (delivered: ${bDeliveredFull + bDeliveredHalf})</div>
                </div>
            `;
            document.getElementById('dashboardGrid').innerHTML = gridHtml;

            let breakHtml = `<div class="dash-quality">`;
            qualities.forEach(q => {
                const f = counts[q].full;
                const h = counts[q].half;
                const df = counts[q].deliveredFull;
                const dh = counts[q].deliveredHalf;
                const total = f + h;
                if (total > 0) {
                    breakHtml += `<span class="q-item">${q}: <span class="q-num">${total}</span> (${f} full + ${h} half) · delivered: ${df + dh}</span>`;
                }
            });
            breakHtml += `</div>`;
            document.getElementById('dashboardBreakdown').innerHTML = breakHtml;
        }

        function renderAll() {
            renderQualityButtons();
            const filtered = getFilteredEntries();
            renderSummaryMini(filtered);
            renderTable(filtered);
            renderWorkers();
            renderDashboard();
            populateFilterWorker();
        }

        // ─── FILTER WORKER DROPDOWN ──────────────────
        function populateFilterWorker() {
            const sel = document.getElementById('filterWorker');
            const current = sel.value;
            const sorted = [...workers].sort((a, b) => a.number - b.number);
            sel.innerHTML = '<option value="all">All Workers</option>';
            sorted.forEach(w => {
                const opt = document.createElement('option');
                opt.value = w.number;
                opt.textContent = `${w.number} · ${w.name}`;
                sel.appendChild(opt);
            });
            if (current && workers.some(w => String(w.number) === String(current))) sel.value = current;
            else sel.value = 'all';
        }

        // ─── CRUD ENTRIES ─────────────────────────────
        function deleteEntry(id) {
            if (!confirm('Delete this entry?')) return;
            entries = entries.filter(e => e.id !== id);
            selectedIds.delete(id);
            saveEntries(entries);
            renderAll();
            showToast('Entry deleted.', 'info');
        }

        function toggleDelivered(id) {
            const entry = entries.find(e => e.id === id);
            if (!entry) return;
            entry.delivered = !entry.delivered;
            saveEntries(entries);
            renderAll();
            showToast(entry.delivered ? 'Marked as delivered.' : 'Marked as remaining.', 'info');
        }

        function editEntry(id) {
            const entry = entries.find(e => e.id === id);
            if (!entry) return;
            editingEntryId = id;
            document.getElementById('modalQuality').value = entry.quality;
            document.getElementById('modalTitle').textContent = `Edit ${entry.quality} Entry`;
            document.getElementById('modalFullCount').value = entry.fullCount || 0;
            document.getElementById('modalHalfCount').value = entry.halfCount || 0;
            document.getElementById('modalDelivered').checked = entry.delivered || false;
            selectedWorkerNum = entry.workerNum || null;
            document.getElementById('modalWorker').value = selectedWorkerNum || '';
            renderWorkerChips();
            document.getElementById('entryModal').classList.add('active');
            document.getElementById('modalFullCount').focus();
        }

        // ─── CRUD WORKERS ─────────────────────────────
        function handleWorkerSubmit() {
            const num = parseInt(document.getElementById('workerNumber').value);
            const name = document.getElementById('workerName').value.trim();
            if (isNaN(num) || num < 1) { showToast('Enter valid number.', 'error'); return; }
            if (!name) { showToast('Enter name.', 'error'); return; }

            const existing = workers.find(w => w.number === num);
            if (existing && editingWorkerNumber === null) {
                showToast(`#${num} already exists.`, 'error');
                return;
            }

            if (editingWorkerNumber !== null) {
                const idx = workers.findIndex(w => w.number === editingWorkerNumber);
                if (idx !== -1) {
                    if (editingWorkerNumber !== num) {
                        const conflict = workers.find(w => w.number === num);
                        if (conflict) { showToast(`#${num} already used.`, 'error'); return; }
                        workers[idx].number = num;
                    }
                    workers[idx].name = name;
                }
                editingWorkerNumber = null;
                document.getElementById('workerSubmitBtn').textContent = '➕ Add';
                document.getElementById('workerCancelBtn').style.display = 'none';
                showToast('Worker updated.', 'success');
            } else {
                workers.push({ number: num, name });
                showToast('Worker added.', 'success');
            }

            saveWorkers(workers);
            renderAll();
            document.getElementById('workerNumber').value = '';
            document.getElementById('workerName').value = '';
        }

        function editWorker(number) {
            const w = workers.find(w => w.number === number);
            if (!w) return;
            editingWorkerNumber = number;
            document.getElementById('workerNumber').value = w.number;
            document.getElementById('workerName').value = w.name;
            document.getElementById('workerSubmitBtn').textContent = '✏️ Update';
            document.getElementById('workerCancelBtn').style.display = 'inline-block';
        }

        function cancelWorkerEdit() {
            editingWorkerNumber = null;
            document.getElementById('workerNumber').value = '';
            document.getElementById('workerName').value = '';
            document.getElementById('workerSubmitBtn').textContent = '➕ Add';
            document.getElementById('workerCancelBtn').style.display = 'none';
        }

        function deleteWorker(number) {
            if (!confirm(`Delete worker #${number}?`)) return;
            workers = workers.filter(w => w.number !== number);
            saveWorkers(workers);
            renderAll();
            showToast('Worker deleted.', 'info');
            cancelWorkerEdit();
        }

        // ─── FILTERS ──────────────────────────────────
        function applyFilters() {
            // Clear selection when filtering
            clearSelection();
            renderAll();
        }

        function resetFilters() {
            document.getElementById('filterDateRange').value = 'today';
            document.getElementById('filterDateFrom').style.display = 'none';
            document.getElementById('filterDateTo').style.display = 'none';
            document.getElementById('filterDateFrom').value = '';
            document.getElementById('filterDateTo').value = '';
            document.getElementById('filterQuality').value = 'all';
            document.getElementById('filterWorker').value = 'all';
            document.getElementById('filterDelivered').value = 'all';
            clearSelection();
            renderAll();
        }

        document.getElementById('filterDateRange').addEventListener('change', function() {
            if (this.value === 'custom') {
                document.getElementById('filterDateFrom').style.display = 'inline-block';
                document.getElementById('filterDateTo').style.display = 'inline-block';
                document.getElementById('filterDateFrom').value = todayStr();
                document.getElementById('filterDateTo').value = todayStr();
            } else {
                document.getElementById('filterDateFrom').style.display = 'none';
                document.getElementById('filterDateTo').style.display = 'none';
                document.getElementById('filterDateFrom').value = '';
                document.getElementById('filterDateTo').value = '';
            }
            clearSelection();
            renderAll();
        });

        document.getElementById('filterQuality').addEventListener('change', function() { clearSelection();
            renderAll(); });
        document.getElementById('filterWorker').addEventListener('change', function() { clearSelection();
            renderAll(); });
        document.getElementById('filterDelivered').addEventListener('change', function() { clearSelection();
            renderAll(); });

        // ─── EXPORT CSV ──────────────────────────────
        function exportCSV() {
            if (entries.length === 0) { showToast('No data.', 'error'); return; }
            const headers = ['Date', 'Quality', 'Full Boxes', 'Half Boxes', 'Worker Number', 'Worker Name', 'Delivered'];
            const rows = entries.map(e => {
                const w = getWorkerByNumber(e.workerNum);
                return [
                    e.date, e.quality, e.fullCount || 0, e.halfCount || 0,
                    e.workerNum || '', w ? w.name : '',
                    e.delivered ? 'Yes' : 'No'
                ];
            });
            let csv = headers.join(',') + '\n';
            rows.forEach(r => {
                csv += r.map(v => `"${String(v).replace(/"/g, '""')}"`).join(',') + '\n';
            });
            const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
            const link = document.createElement('a');
            link.href = URL.createObjectURL(blob);
            link.download = `salmon_${todayStr()}.csv`;
            link.click();
            URL.revokeObjectURL(link.href);
            showToast('CSV exported!', 'success');
        }

        // ─── CLEAR ALL ────────────────────────────────
        function clearAllData() {
            if (!confirm('Delete ALL data?')) return;
            if (!confirm('Are you sure?')) return;
            entries = [];
            selectedIds.clear();
            saveEntries(entries);
            renderAll();
            showToast('All data cleared.', 'info');
        }

        // ─── TABS ─────────────────────────────────────
        document.querySelectorAll('.bottom-nav button').forEach(btn => {
            btn.addEventListener('click', function() {
                document.querySelectorAll('.bottom-nav button').forEach(b => b.classList.remove('active'));
                this.classList.add('active');
                const tabId = this.dataset.tab;
                document.querySelectorAll('.tab-content').forEach(el => el.classList.remove('active'));
                document.getElementById(tabId).classList.add('active');
            });
        });

        // ─── MODAL OVERLAY CLOSE ──────────────────────
        document.getElementById('entryModal').addEventListener('click', function(e) {
            if (e.target === this) closeModal();
        });

        // ─── INIT ─────────────────────────────────────
        if (!workers.length) {
            workers = loadWorkers();
            saveWorkers(workers);
        }
        populateFilterWorker();
        renderAll();

        console.log('🐟 Tracker v4 – batch selection added');
    </script>
</body>
</html>
